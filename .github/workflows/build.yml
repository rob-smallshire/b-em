name: Build

on:
  push:
    branches: [ master, rjs/* ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    name: Build on Windows (MinGW via makebem.bat)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-allegro
          make

    - name: Setup Allegro paths for makebem.bat
      shell: bash
      run: |
        # Create a parallel allegro5 directory structure as expected by makebem.bat
        # Point it to the MSYS2 MinGW installation
        mkdir -p ../allegro5/include
        mkdir -p ../allegro5/lib
        mkdir -p ../allegro5/bin

        # Link to MSYS2 Allegro installation
        cp -r /mingw64/include/allegro5 ../allegro5/include/
        cp /mingw64/lib/liballegro*.a ../allegro5/lib/ || true
        cp /mingw64/lib/liballegro*.dll.a ../allegro5/lib/ || true
        cp /mingw64/bin/allegro*.dll ../allegro5/bin/ || true

    - name: Build with makebem.bat
      shell: cmd
      run: makebem.bat

    - name: Verify binaries exist
      run: |
        test -f b-em.exe
        test -f src/m7makechars.exe
        test -f src/hdfmt.exe
        test -f src/jstest.exe
        test -f src/gtest.exe
        test -f src/sdf2imd.exe
        test -f src/bsnapdump.exe
        echo "All Windows binaries built successfully!"

    - name: Smoke test utilities
      run: |
        echo "Testing m7makechars..."
        src/m7makechars.exe 2>&1 || true

        echo "Testing hdfmt..."
        src/hdfmt.exe 2>&1 || true

        echo "Testing bsnapdump..."
        src/bsnapdump.exe 2>&1 || true

        echo "Testing sdf2imd..."
        src/sdf2imd.exe 2>&1 || true

        echo "All Windows utilities executed without crashing!"

  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Install Allegro 5 and required addons
        # Note: some addons like primitives are included in liballegro5-dev
        sudo apt-get install -y \
          liballegro5-dev \
          zlib1g-dev \
          pkg-config \
          automake \
          autoconf

    - name: Generate build system
      run: ./autogen.sh

    - name: Configure
      run: ./configure

    - name: Build
      run: make

    - name: Verify binaries exist
      run: |
        test -f src/b-em
        test -f src/m7makechars
        test -f src/hdfmt
        test -f src/jstest
        test -f src/gtest
        test -f src/sdf2imd
        test -f src/bsnapdump
        echo "All binaries built successfully!"

    - name: Smoke test utilities
      run: |
        # Test utilities can execute without crashing
        echo "Testing m7makechars..."
        src/m7makechars 2>&1 || true

        echo "Testing hdfmt..."
        src/hdfmt 2>&1 || true

        echo "Testing bsnapdump..."
        src/bsnapdump 2>&1 || true

        echo "Testing sdf2imd..."
        src/sdf2imd 2>&1 || true

        echo "All utilities executed without crashing!"

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew update
        brew install allegro pkg-config automake autoconf

    - name: Generate build system
      run: ./autogen.sh

    - name: Configure
      run: ./configure

    - name: Build and check for warnings
      run: |
        if make 2>&1 | tee build.log | grep -i "warning.*duplicate"; then
          echo "ERROR: Found duplicate library warnings!"
          cat build.log
          exit 1
        fi
        echo "SUCCESS: Build completed with no duplicate library warnings!"

    - name: Verify binaries exist
      run: |
        test -f src/b-em
        test -f src/m7makechars
        test -f src/hdfmt
        test -f src/jstest
        test -f src/gtest
        test -f src/sdf2imd
        test -f src/bsnapdump
        echo "All binaries built successfully!"

    - name: Smoke test utilities
      run: |
        # Test utilities can execute without crashing
        # Most should show usage/help when run without args

        echo "Testing m7makechars..."
        src/m7makechars 2>&1 || true  # May exit non-zero without args

        echo "Testing hdfmt..."
        src/hdfmt 2>&1 || true

        echo "Testing bsnapdump..."
        src/bsnapdump 2>&1 || true

        echo "Testing sdf2imd..."
        src/sdf2imd 2>&1 || true

        echo "All utilities executed without crashing!"

    - name: Smoke test main binary
      run: |
        # b-em requires GUI/display, so just verify it's properly linked
        echo "Checking b-em binary..."
        file src/b-em
        otool -L src/b-em | grep -i allegro
        echo "b-em binary is properly linked!"
