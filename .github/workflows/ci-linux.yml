name: Linux Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Install Allegro 5 and required addons
        # Note: some addons like primitives are included in liballegro5-dev
        sudo apt-get install -y \
          liballegro5-dev \
          zlib1g-dev \
          pkg-config \
          automake \
          autoconf

    - name: Generate build system
      run: ./autogen.sh

    - name: Configure
      run: ./configure

    - name: Build
      run: make

    - name: Verify binaries exist
      run: |
        test -f src/b-em
        test -f src/m7makechars
        test -f src/hdfmt
        test -f src/jstest
        test -f src/gtest
        test -f src/sdf2imd
        test -f src/bsnapdump
        echo "All binaries built successfully!"

    - name: Smoke test utilities
      run: |
        # Test utilities can execute without crashing
        echo "Testing m7makechars..."
        src/m7makechars 2>&1 || true

        echo "Testing hdfmt..."
        src/hdfmt 2>&1 || true

        echo "Testing bsnapdump..."
        src/bsnapdump 2>&1 || true

        echo "Testing sdf2imd..."
        src/sdf2imd 2>&1 || true

        echo "All utilities executed without crashing!"
